name: Update Hot Data

on:
  schedule:
    # 每天 UTC 0:00 = 北京时间 8:00
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  update-hot-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch hot data
        run: python fetch_hot.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hot_data.json
          git commit -m "Auto-update hot data $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "No changes to commit"
          git push
